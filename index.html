<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Səsvermə Sinfi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--p:#7c3aed;--p2:#ec4899;--o:#f59e0b;--g:#10b981;--b:#0ea5e9;--r:#ef4444;--ink:#1e1b4b}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);min-height:100vh;
background:linear-gradient(135deg,#fde68a,#fbcfe8 40%,#c4b5fd 75%,#a5f3fc);background-attachment:fixed}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 22px;
background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;box-shadow:0 4px 18px #7c3aed55}
header h1{margin:0;font-size:22px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:bold;color:#fff}
.admin{background:var(--r)}.teacher{background:var(--b)}.student{background:var(--g)}
.open{background:var(--o)}.started{background:var(--g)}.finished{background:#64748b}
nav{display:flex;gap:8px;padding:12px 22px;flex-wrap:wrap}
nav button{background:#fff;color:var(--p);border:2px solid var(--p)}
nav button.on{background:var(--p);color:#fff}
main{padding:0 22px 40px;max-width:1100px;margin:auto}
.card{background:#ffffffee;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 6px 20px #4c1d9522}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.img{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #0002;border:3px solid transparent}
.img.cur{border-color:var(--o);box-shadow:0 0 0 4px #f59e0b55}
.img img{width:100%;height:170px;object-fit:cover;display:block;background:#ddd}
.img .in{padding:10px;display:flex;flex-direction:column;gap:6px}
button{font:inherit;font-weight:bold;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;color:#fff;
background:linear-gradient(90deg,var(--p),var(--p2));transition:transform .1s}
button:hover{transform:scale(1.05)}
button.g{background:linear-gradient(90deg,#10b981,#06b6d4)}
button.o{background:linear-gradient(90deg,#f59e0b,#ef4444)}
button.s{background:#e2e8f0;color:var(--ink)}
button.sm{padding:4px 10px;font-size:13px}
input,select{font:inherit;padding:9px 12px;border-radius:12px;border:2px solid #c4b5fd;background:#fff;max-width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars button{background:none;color:#cbd5e1;font-size:26px;padding:0 2px}
.stars button.on{color:var(--o)}
.big{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.big img{max-width:100%;max-height:380px;border-radius:18px;box-shadow:0 8px 24px #0003}
.muted{opacity:.7;font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:14px;color:#fff;
background:var(--g);display:none;z-index:9;max-width:90vw}
.auth{max-width:420px;margin:60px auto}
h2,h3{margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const SUPABASE_URL='https://acorghpgfcqhltnzjepg.supabase.co';
const SUPABASE_KEY='sb_publishable_DT6DrSQR-mDsfM_UzadNVQ_BhvY33JM';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
const $=s=>document.querySelector(s), app=$('#app');
const ROLE={admin:'Admin',teacher:'Müəllim',student:'Şagird'};
const ST={open:'Yükləmə açıq',started:'Başlayıb',finished:'Bitib'};
let token=null,profile=null,tab='',ctx={},authMode='login',last='';
try{token=localStorage.getItem('tok')}catch(e){}

const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=async p=>{const{data,error}=await p;if(error)throw error;return data};
const rpc=(fn,a={})=>q(sb.rpc(fn,{p_token:token,...a}));
const run=async f=>{try{await f()}catch(e){const m=e.message||String(e);if(/Sessiya bitib/.test(m))logout();toast(m,1)}};
const url=p=>sb.storage.from('images').getPublicUrl(p).data.publicUrl;
function toast(m,err){const t=$('#toast');t.textContent=m;t.style.background=err?'#ef4444':'#10b981';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
const stars=(n,fn,dis)=>`<span class="stars">${[1,2,3,4,5].map(i=>`<button ${dis?'disabled':''} class="${i<=n?'on':''}" onclick="${fn}(${i})">★</button>`).join('')}</span>`;
const badge=(c,t)=>`<span class="badge ${c}">${t}</span>`;

/* ---------- GİRİŞ ---------- */
function authHTML(){const reg=authMode==='reg';return`<div class="auth card"><h2>🎓 Səsvermə Sinfi</h2>
<p class="muted">${reg?'Yeni şagird hesabı yarat':'Hesabına daxil ol'}</p>
<div style="display:grid;gap:10px">
<input id="em" placeholder="İstifadəçi adı" maxlength="30" autocomplete="username"><input id="pw" type="password" placeholder="Şifrə" autocomplete="current-password">
<button onclick="doAuth()">${reg?'Qeydiyyat':'Daxil ol'}</button>
<button class="s" onclick="authMode='${reg?'login':'reg'}';render()">${reg?'Hesabım var':'Qeydiyyatdan keç'}</button></div></div>`}
window.doAuth=()=>run(async()=>{
 const n=$('#em').value.trim(),p=$('#pw').value;
 if(!n)throw new Error('İstifadəçi adı yazın');
 const d=await q(sb.rpc(authMode==='reg'?'app_register':'app_login',{p_username:n,p_password:p}));
 token=d.token;try{localStorage.setItem('tok',token)}catch(e){}
 profile={id:d.id,name:d.name,role:d.role};tab='';ctx={};render();
});
window.logout=()=>{if(token)sb.rpc('app_logout',{p_token:token});token=null;profile=null;try{localStorage.removeItem('tok')}catch(e){}render()};

/* ---------- ÇƏRÇİVƏ ---------- */
function tabs(){const r=profile.role;
 if(r==='student')return[['images','🖼️ Şəkillərim'],['vote','⭐ Səsvermə']];
 if(r==='teacher')return[['slides','🎞️ Slaydlar']];
 return[['slides','🎞️ Slaydlar'],['users','👥 İstifadəçilər'],['images','🖼️ Şəkillərim']]}
window.go=t=>{tab=t;ctx={};render()};
const views={};
async function render(force=true){
 let html;
 if(!profile)html=authHTML();
 else{
  if(!tab||!tabs().some(t=>t[0]===tab))tab=tabs()[0][0];
  let inner;try{inner=await views[tab]()}catch(e){if(!force)return;inner=`<div class="card">⚠️ ${h(e.message)}</div>`;if(/Sessiya bitib/.test(e.message))return logout()}
  html=`<header><h1>🎓 Səsvermə Sinfi</h1><div class="row"><b>${h(profile.name)}</b>${badge(profile.role,ROLE[profile.role])}<button class="s sm" onclick="logout()">Çıxış</button></div></header>
  <nav>${tabs().map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav><main>${inner}</main>`;
 }
 if(!force&&html===last)return;
 app.innerHTML=html;last=html;
}
setInterval(()=>{if(profile&&!document.activeElement?.matches('input,select')&&!$('#f')?.files.length&&!$('#t')?.value)render(false)},3000);

/* ---------- ŞƏKİLLƏRİM ---------- */
views.images=async()=>{
 const list=await rpc('my_images'),open=await rpc('open_slides');
 return`<div class="card"><h3>📤 Yeni şəkil yüklə</h3><div class="row">
 <input type="file" id="f" accept="image/*"><input id="t" placeholder="Şəkilin adı"><button class="g" onclick="upload()">Yüklə</button></div></div>
 <h3>Mənim şəkillərim (${list.length})</h3>
 ${list.length?'':'<div class="card muted">Hələ şəkil yoxdur. Yuxarıdan yüklə!</div>'}
 <div class="grid">${list.map(i=>{const locked=i.slide_id&&i.slide_status!=='open';return`<div class="img"><img src="${url(i.path)}"><div class="in">
 <b>${h(i.title)}</b>
 ${i.slide_id?`<span class="muted">Slayd: ${h(i.slide_title)} ${badge(i.slide_status,ST[i.slide_status])}</span>`:'<span class="muted">Slayda atanmayıb</span>'}
 ${locked?'<span class="muted">🔒 Slayd başlayıb</span>':`<select onchange="assign('${i.id}',this.value)"><option value="">— Slayd seç —</option>
  ${open.map(s=>`<option value="${s.id}" ${s.id===i.slide_id?'selected':''}>${h(s.title)} (${s.cnt}/${s.max_images})</option>`).join('')}</select>`}
 <div class="row"><button class="sm" onclick="rename('${i.id}','${h(i.title).replace(/'/g,'')}')">✏️ Ad</button>
 ${locked&&profile.role!=='admin'?'':`<button class="sm o" onclick="delImg('${i.id}')">🗑️ Sil</button>`}</div></div></div>`}).join('')}</div>`};
window.upload=()=>run(async()=>{
 const f=$('#f').files[0],title=$('#t').value.trim();
 if(!f)throw new Error('Şəkil seçin');if(!title)throw new Error('Şəkilə ad verin');
 if(f.size>5*1024*1024)throw new Error('Şəkil 5MB-dan böyük olmasın');
 const path=`${profile.id}/${Date.now()}_${f.name.replace(/[^\w.]/g,'_')}`;
 await q(sb.storage.from('images').upload(path,f));
 await rpc('add_image',{p_title:title,p_path:path});
 toast('Şəkil yükləndi ✅');render();
});
window.assign=(id,sid)=>run(async()=>{await rpc('assign_image',{p_id:id,p_slide:sid||null});toast('Yeniləndi ✅');render()});
window.rename=(id,old)=>run(async()=>{const t=prompt('Yeni ad:',old);if(!t)return;await rpc('rename_image',{p_id:id,p_title:t});render()});
window.delImg=id=>run(async()=>{if(!confirm('Silinsin?'))return;await rpc('delete_image',{p_id:id});render()});

/* ---------- SƏSVERMƏ (şagird) ---------- */
views.vote=async()=>{
 if(ctx.v)return voteDetail();
 const list=await rpc('started_slides');
 return`<h3>Aktiv slaydlar</h3>${list.length?'':'<div class="card muted">İndi səsvermə gedən slayd yoxdur.</div>'}
 <div class="grid">${list.map(s=>`<div class="card"><b>🎞️ ${h(s.title)}</b><br>${s.teacher_present?badge('teacher','Müəllim slaydda'):badge('started','Hamısına baxa bilərsən')}<br><br><button onclick="ctx.v='${s.id}';render()">Aç</button></div>`).join('')}</div>`};
async function voteDetail(){
 const d=await rpc('slide_student',{p_id:ctx.v}),s=d.slide,open=s.status==='started';
 return`<div class="row"><button class="s" onclick="ctx.v=null;render()">← Geri</button><h2>🎞️ ${h(s.title)}</h2></div>
 ${!open?'<div class="card">Bu slaydda səsvermə bitib.</div>':''}
 ${s.teacher_present?'<div class="card">👩‍🏫 Müəllim slayddadır — yalnız cari şəkilə səs verə bilərsən.</div>':''}
 <div class="grid">${d.images.map(i=>`<div class="img ${i.id===s.current_image_id?'cur':''}"><img src="${url(i.path)}"><div class="in">
 <b>${h(i.title)}</b>${i.own?'<span class="muted">Bu sənin şəklindir</span>':stars(i.my||0,`vote.bind(0,'${i.id}')`,!open)}</div></div>`).join('')}</div>`}
window.vote=(id,score)=>run(async()=>{await rpc('cast_vote',{p_image:id,p_score:score});toast('Səs verildi ⭐');render()});

/* ---------- SLAYDLAR (müəllim/admin) ---------- */
views.slides=async()=>{
 if(ctx.s)return slideDetail();
 const list=await rpc('slides_list');
 return`<div class="card"><h3>➕ Yeni slayd</h3><div class="row"><input id="st" placeholder="Slayd adı">
 <label>Şəkil limiti: <input id="sm" type="number" min="1" value="10" style="width:80px"></label><button class="g" onclick="newSlide()">Yarat</button></div></div>
 ${list.length?'':'<div class="card muted">Hələ slayd yoxdur.</div>'}
 <div class="grid">${list.map(s=>`<div class="card"><b>🎞️ ${h(s.title)}</b><br>${badge(s.status,ST[s.status])}
 <p>${s.cnt} / ${s.max_images} şəkil</p><div class="row"><button onclick="ctx.s='${s.id}';render()">İdarə et</button>
 <button class="o sm" onclick="delSlide('${s.id}')">Sil</button></div></div>`).join('')}</div>`};
window.newSlide=()=>run(async()=>{const title=$('#st').value.trim();if(!title)throw new Error('Slayd adı yazın');
 await rpc('create_slide',{p_title:title,p_max:+$('#sm').value||10});render()});
window.delSlide=id=>run(async()=>{if(!confirm('Slayd silinsin? Şəkillər slayddan ayrılacaq.'))return;await rpc('delete_slide',{p_id:id});render()});

async function slideDetail(){
 const d=await rpc('slide_staff',{p_id:ctx.s}),s=d.slide,imgs=d.images;
 const avg=i=>i.scores.length?(i.scores.reduce((a,b)=>a+b.s,0)/i.scores.length).toFixed(1)+' ⭐ ('+i.scores.length+' səs)':'səs yoxdur';
 const who=i=>i.scores.length?`<details><summary>Kim səs verdi</summary><small>${i.scores.map(x=>h(x.n)+' — '+x.s+'★').join('<br>')}</small></details>`:'';
 ctx.imgs=imgs;ctx.slide=s;
 const cur=imgs.find(i=>i.id===s.current_image_id);
 return`<div class="row"><button class="s" onclick="ctx.s=null;render()">← Geri</button><h2>🎞️ ${h(s.title)}</h2>${badge(s.status,ST[s.status])}</div>
 <div class="card"><div class="row"><input id="et" value="${h(s.title)}"><label>Limit: <input id="em2" type="number" min="1" value="${s.max_images}" style="width:80px"></label>
 <button class="sm" onclick="saveSlide()">💾 Saxla</button></div><br><div class="row">
 ${s.status==='open'?`<button class="g" onclick="setStatus('started')">▶ Slaydı başlat</button>`:''}
 ${s.status==='started'?`<button class="o" onclick="setStatus('finished')">⏹ Bitir</button>
 <button class="${s.teacher_present?'o':'g'}" onclick="togglePresent()">${s.teacher_present?'👩‍🏫 Slayddan çıx (hamı baxa bilər)':'👩‍🏫 Slayda gir (yalnız cari şəkil)'}</button>`:''}
 ${s.status==='finished'?`<button class="g" onclick="setStatus('started')">🔄 Yenidən başlat</button>`:''}</div>
 ${s.status!=='open'?'<p class="muted">🔒 Slayd başlayıb: şəkillər silinə və dəyişdirilə bilməz, sıra və ad dəyişə bilər.</p>':''}</div>
 ${s.status==='started'&&cur?`<div class="card big"><img src="${url(cur.path)}"><div><h2>${h(cur.title)}</h2>
 <p>👤 <b>${h(cur.owner_name)}</b></p><p>${avg(cur)}</p>${who(cur)}
 <div class="row"><button onclick="step(-1)">◀ Əvvəlki</button><button onclick="step(1)">Növbəti ▶</button></div></div></div>`:''}
 <h3>Şəkillər (${imgs.length}/${s.max_images})</h3>${imgs.length?'':'<div class="card muted">Şagirdlər hələ şəkil atamayıb.</div>'}
 <div class="grid">${imgs.map((i,k)=>`<div class="img ${i.id===s.current_image_id?'cur':''}"><img src="${url(i.path)}"><div class="in">
 <b>${k+1}. ${h(i.title)}</b><span>👤 ${h(i.owner_name)}</span><span class="muted">${avg(i)}</span>${who(i)}
 <div class="row"><button class="sm s" onclick="move('${i.id}',-1)">⬆</button><button class="sm s" onclick="move('${i.id}',1)">⬇</button>
 ${s.status==='started'?`<button class="sm" onclick="setCur('${i.id}')">📍 Göstər</button>`:''}
 ${s.status==='open'?`<button class="sm o" onclick="unassign('${i.id}')">Çıxar</button>`:''}</div></div></div>`).join('')}</div>`}
const upS=p=>run(async()=>{await rpc('update_slide',{p_id:ctx.s,p_patch:p});render()});
window.saveSlide=()=>upS({title:$('#et').value.trim(),max_images:+$('#em2').value||10});
window.setStatus=st=>{
 if(st==='started'&&!ctx.imgs.length)return toast('Əvvəlcə şəkil lazımdır',1);
 upS({status:st,teacher_present:false,...(st==='started'&&!ctx.imgs.some(i=>i.id===ctx.slide.current_image_id)?{current_image_id:ctx.imgs[0].id}:{})})};
window.togglePresent=()=>upS({teacher_present:!ctx.slide.teacher_present});
window.setCur=id=>upS({current_image_id:id});
window.step=d=>{const a=ctx.imgs;let k=a.findIndex(i=>i.id===ctx.slide.current_image_id);if(k<0)k=0;upS({current_image_id:a[(k+d+a.length)%a.length].id})};
window.move=(id,d)=>run(async()=>{await rpc('move_image',{p_id:id,p_dir:d});render()});
window.unassign=id=>run(async()=>{await rpc('assign_image',{p_id:id,p_slide:null});render()});

/* ---------- İSTİFADƏÇİLƏR (admin) ---------- */
views.users=async()=>{
 const list=await rpc('users_list');
 return`<h3>İstifadəçilər (${list.length})</h3><div class="card">${list.map(u=>`<div class="row" style="padding:6px 0;border-bottom:1px solid #eee">
 <b style="flex:1;min-width:140px">${h(u.full_name)}</b>${badge(u.role,ROLE[u.role])}
 <select onchange="setRole('${u.id}',this.value)">${Object.keys(ROLE).map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${ROLE[r]}</option>`).join('')}</select>
 <button class="sm s" onclick="setPass('${u.id}')">🔑 Şifrə</button></div>`).join('')}</div>`};
window.setRole=(id,role)=>run(async()=>{await rpc('set_role',{p_user:id,p_role:role});toast('Rol dəyişdi ✅');render()});
window.setPass=id=>run(async()=>{const p=prompt('Yeni şifrə:');if(!p)return;await rpc('admin_set_password',{p_user:id,p_pass:p});toast('Şifrə dəyişdi ✅')});

/* ---------- START ---------- */
(async()=>{
 if(token){try{profile=await rpc('app_me')}catch(e){token=null;try{localStorage.removeItem('tok')}catch(_){}}}
 render();
})();
</script>
</body>
</html>
